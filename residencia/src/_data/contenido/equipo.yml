# src/assets/img/equipo/ con el nombre indicado (por ejemplo direccion.jpg).
# Podés agregar o quitar personas copiando o borrando un bloque "- area: ...".

- area: "Dirección"
  nombre: "[Nombre y apellido]"
  cargo: "[Cargo]"
