# Página CONTACTO y textos del formulario.

seo:
  titulo: "Contacto · {nombre}"
  descripcion: "Consultá disponibilidad o coordiná una visita a {nombre}, en {ciudad}. Teléfono, WhatsApp, email, dirección y horarios de atención."

encabezado:
  eyebrow: "Contacto"
  titulo: "Hablemos con tranquilidad"
  bajada: "Contanos qué necesitás. Te respondemos a la brevedad y, si querés, coordinamos una visita para que conozcas la residencia."

canales:
  titulo: "Otras formas de contactarnos"
  whatsapp: "La forma más rápida de hablar con nosotros."
  telefono: "Atención telefónica: {atencion}."
  email: "Para consultas detalladas o envío de documentación."

formulario:
  titulo: "Dejanos tu consulta"
  bajada: "Completá tus datos y te contactamos. Los campos marcados con * son obligatorios."
  motivos:
    - valor: "disponibilidad"
      texto: "Consultar disponibilidad"
    - valor: "visita"
      texto: "Solicitar una visita"
    - valor: "temporaria"
      texto: "Estadía temporaria"
    - valor: "informacion"
      texto: "Información general"
    - valor: "otro"
      texto: "Otro motivo"
  tipos:
    - "Permanente"
    - "Temporaria"
    - "Todavía no lo sé"
  boton: "Enviar consulta"
