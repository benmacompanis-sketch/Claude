  exito:
    titulo: "¡Gracias por escribirnos!"
    texto: "Recibimos tu consulta. Te vamos a contactar a la brevedad para responderte y, si querés, coordinar una visita."
  error:
    titulo: "No pudimos enviar tu consulta"
    texto: "Puede ser un problema momentáneo de conexión. Probá de nuevo en unos minutos o escribinos por WhatsApp."

mapa:
  titulo: "Cómo llegar"
  nota: "El mapa interactivo se carga solo si lo pedís, para que la página sea más rápida."

visitas:
  titulo: "Visitas a la residencia"
  texto: "Coordinamos las visitas con anticipación para poder dedicarte el tiempo que merecés."
