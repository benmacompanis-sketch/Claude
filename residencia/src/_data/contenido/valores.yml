  texto: "Propuestas para moverse, crear, recordar y compartir, respetando las ganas de cada uno."

- icono: "users-three"
  titulo: "Acompañamiento familiar"
  texto: "Las familias son parte. Mantenemos el contacto y estamos disponibles para cada consulta."

- icono: "wheelchair"
  titulo: "Espacios adaptados"
  texto: "Accesos, circulaciones y baños pensados para la movilidad de las personas mayores."

- icono: "identification-badge"
  titulo: "Equipo capacitado"
