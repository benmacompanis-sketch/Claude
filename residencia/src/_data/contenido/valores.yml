  texto: "Espacios ordenados y pensados para moverse con confianza, de día y de noche."

- icono: "bowl-steam"
  titulo: "Alimentación equilibrada"
  texto: "Comidas variadas y ricas, adaptadas a lo que cada persona necesita."

- icono: "palette"
