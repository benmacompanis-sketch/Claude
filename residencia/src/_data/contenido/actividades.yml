# Página ACTIVIDADES.
# Son propuestas de ejemplo: reemplazalas por las que realmente se hacen en la residencia.

seo:
  titulo: "Actividades y vida diaria · {nombre}"
  descripcion: "Cómo es un día en {nombre}: rutinas tranquilas, ejercicios suaves, música, talleres, juegos, lectura y encuentros para compartir."

encabezado:
  eyebrow: "Actividades"
  titulo: "Días con ritmo propio, y con motivos para compartir"
  bajada: "Proponemos actividades para moverse, crear, recordar y encontrarse. Cada residente participa según sus ganas y sus posibilidades."
  foto: "actividades/hero"
  alt: "Mesa con juego de damas, ovillo de lana, un libro y una taza"

dia:
  eyebrow: "El día a día"
  titulo: "Un día en la residencia"
  bajada: "Un ritmo tranquilo y previsible, que da seguridad. Y dentro de ese ritmo, lugar para los tiempos y las costumbres de cada uno."
  nota: "Horarios orientativos: se adaptan a cada persona."

propuestas:
  eyebrow: "Propuestas"
  titulo: "Algunas de las cosas que hacemos"
  bajada: "Las actividades cambian según la época del año y los intereses del grupo. Siempre son una invitación, nunca una obligación."
  nota: "[Completar con la agenda real de actividades de la residencia.]"

lista:
  - id: "ejercicios"
    nombre: "Ejercicios suaves"
    icono: "person-simple-tai-chi"
    texto: "Movimiento adaptado a cada persona para mantener la movilidad, el equilibrio y el buen ánimo."
    foto: "actividades/ejercicios"
    alt: "Pelotas de ejercicio, banda elástica y toalla sobre una colchoneta"
  - id: "juegos"
    nombre: "Juegos de mesa"
    icono: "club"
    texto: "Truco, generala, dominó o damas: la excusa perfecta para reírse y compartir la tarde."
    foto: "actividades/juegos-de-mesa"
    alt: "Tablero de damas y cartas españolas sobre la mesa"
  - id: "lectura"
    nombre: "Lectura"
    icono: "book-open"
    texto: "Libros, diarios y revistas para leer en silencio o en voz alta, en ronda."
    foto: "actividades/lectura"
    alt: "Libro abierto con anteojos y una taza de té"
  - id: "musica"
    nombre: "Música"
    icono: "music-notes"
    texto: "Canciones de siempre, ritmos para acompañar con palmas y tardes de recuerdos."
    foto: "actividades/musica"
    alt: "Disco de vinilo y partituras"
  - id: "talleres"
    nombre: "Talleres"
    icono: "paint-brush"
    texto: "Manualidades, pintura y otras propuestas para crear con las manos, a su ritmo."
    foto: "actividades/talleres"
    alt: "Acuarelas, pinceles y una pintura en proceso"
  - id: "cognitivas"
    nombre: "Actividades cognitivas"
    icono: "puzzle-piece"
    texto: "Juegos de memoria, palabras cruzadas y ejercicios para mantener la mente activa."
    foto: "actividades/cognitivas"
    alt: "Crucigrama, lápiz y piezas de rompecabezas"
  - id: "aire-libre"
    nombre: "Espacios al aire libre"
    icono: "tree"
    texto: "Caminatas cortas, sol en el patio y tiempo en el jardín, cuando el clima acompaña."
    foto: "actividades/aire-libre"
    alt: "Jardín con flores y un camino de piedras"
  - id: "encuentros"
    nombre: "Encuentros sociales"
    icono: "coffee"
    texto: "Mates, charlas y meriendas compartidas: los momentos que hacen comunidad."
    foto: "actividades/encuentros"
    alt: "Mesa con mate, termo, tazas y medialunas"
  - id: "celebraciones"
    nombre: "Celebraciones"
    icono: "cake"
    texto: "Cumpleaños, fechas patrias y fiestas del año, con la familia invitada cuando es posible."
    foto: "actividades/celebraciones"
    alt: "Torta de cumpleaños con velitas y papel picado"
  - id: "recreativas"
    nombre: "Propuestas recreativas"
    icono: "flower-tulip"
    texto: "Tejido, jardinería, cine y otras actividades que surgen de los gustos del grupo."
    foto: "actividades/recreativas"
    alt: "Ovillos de lana y agujas de tejer"

cierre:
  titulo: "¿Querés ver la agenda del mes?"
  texto: "Te la mandamos por WhatsApp o por email, con cualquier otra información que necesites. Y si querés, coordinamos una visita para que veas cómo es un día acá."
